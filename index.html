<style>
/* [A] WARNA & TEMA - palet "Nusantara": laut toska (--ac), emas songket (--gold), hijau sawah (--g), merah bendera (--r), batik malam (--deep) */
:root{color-scheme:light;--bg:#eef6f4;--card:#fff;--tx:#10302f;--mu:#56716f;--bd:#d3e4e0;--ac:#0a7c86;--deep:#06424a;--gold:#f0b441;--on-gold:#06424a;--r:#c8102e;--y:#946200;--g:#1b7f4b;--rs:#fde3e6;--ys:#fdefc8;--gs:#d8f1e2;--sh:0 1px 2px rgba(6,66,74,.06),0 6px 18px -8px rgba(6,66,74,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#071a1e;--card:#0e2b31;--tx:#e6f3f1;--mu:#92b2af;--bd:#1f4750;--ac:#38cbc2;--r:#ff7b8a;--y:#f5b83d;--g:#4fd08a;--rs:#4a1f27;--ys:#4a3a10;--gs:#0f3a2a;--sh:0 1px 2px rgba(0,0,0,.3)}
/* [B] DASAR: font, latar, ukuran teks */
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
/* [C] HEADER, MENU NAVIGASI & FILTER WILAYAH */
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}.logo{font-weight:700;color:var(--ac)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px}nav a{white-space:nowrap;padding:6px 12px;border-radius:8px;color:var(--mu);text-decoration:none;font-size:14px}nav a.on{background:var(--ac);color:#fff}
.flt{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}select,button{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
/* [D] TATA LETAK: lebar halaman, grid, kartu */
main{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:0 0 10px}.sub{color:var(--mu);margin:0 0 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
/* [E] KOMPONEN: KPI, label/tag, tile provinsi, tabel, bar, kartu rekomendasi, matriks kuadran */
.kpi b{font-size:26px;display:block}.kpi span,.note{color:var(--mu);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.R{background:var(--rs);color:var(--r)}.Y{background:var(--ys);color:var(--y)}.G{background:var(--gs);color:var(--g)}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.tile{padding:12px;border-radius:10px;cursor:pointer;border:1px solid var(--bd)}.tile b{display:block}
.sw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left}td.h{text-align:center;font-weight:600}
.bar{height:12px;border-radius:5px;background:var(--bd);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.row{display:grid;grid-template-columns:minmax(110px,36%) 1fr 110px;gap:8px;align-items:center;margin:5px 0;font-size:13.5px}
.alert{border-left:4px solid var(--r);background:var(--rs)}.rec{border-left:4px solid var(--r)}.rec.Y{border-color:var(--y)}.rec.G{border-color:var(--g)}
.rec dl{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin:8px 0 0}.rec dt{color:var(--mu)}.rec dd{margin:0}
.q{position:relative;height:320px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.q .d{position:absolute;transform:translate(-50%,50%);width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-size:11px;display:grid;place-items:center}
.q .ml{position:absolute;background:var(--mu);opacity:.45}.q .ml.v{top:0;bottom:0;width:1px}.q .ml.hz{left:0;right:0;height:1px}.q .d.R{background:var(--r)}.q .d.Y{background:var(--y)}.q .d.G{background:var(--g)}
.q span{position:absolute;font-size:11px;color:var(--mu);padding:4px 8px}svg text{fill:var(--mu);font-size:11px}

.clk{cursor:pointer}
.btn{background:transparent;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}.btn:hover{background:var(--ac);color:#fff}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow:auto}

body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}

.hero svg{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:75%}
.hero>div{position:relative;max-width:540px}
.hero h2{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.015em;margin:0 0 8px}
.hero p{margin:0 0 14px;opacity:.92}

const $=s=>document.querySelector(s),fm=n=>Math.round(n).toLocaleString("id-ID"),f1=n=>n.toFixed(1).replace(".",","),cap=s=>s=="INDONESIA"?"Seluruh Indonesia":s.replace(/\b\w/g,c=>c.toUpperCase());

const col=v=>v<2.5?"G":v<4?"Y":"R",clr={R:"var(--rs)",Y:"var(--ys)",G:"var(--gs)"},sum=a=>a.reduce((x,y)=>x+y,0),tt=a=>a[0]+a[1]+a[2];
// sc = wilayah terpilih di filter, A = data segmen wilayah itu, NAT = data nasional, SZ = total ulasan

function its(){const a=A(),y=D.S3[sc()],N=SZ(),o=[];for(let i=1;i<17;i++){const k=a[i][0],n=tt(a[i]),y3=y[i][1],y5=y[i][3],t=(tt(y5)&&tt(y3))?rate(y5)-rate(y3):0;o.push({i,k,n,r:rate(a[i]),sz:n/N*100,t,small:n<200,rn:rate(NAT[i])})}
const km=Math.max(1,...o.filter(x=>!x.small).map(x=>x.k));o.forEach(x=>x.s=x.small?0:Math.round(50*x.k/km+30*Math.min(x.r/8,1)+20*Math.min(Math.max(x.t,0)/2,1)));return o}
// urg(): ambang urgensi - skor >=55 Tinggi, >=35 Sedang, selebihnya Rendah

function bars(a){const m=Math.max(...a.map(x=>x.v),1e-9);return a.map(x=>`<div class="row"><span>${x.l}</span><div class="bar"><i style="width:${x.v/m*100}%;background:${x.c||"var(--ac)"}"></i></div><b>${x.t}</b></div>`).join("")}

function line(v,lab){const w=640,h=200,mx=Math.max(...v,.1)*1.2,x=i=>60+i*160,y=t=>h-30-t/mx*(h-50);let s=`<svg viewBox="0 0 ${w} ${h}" width="100%"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${v.map((t,i)=>x(i)+","+y(t)).join(" ")}"/>`;
v.forEach((t,i)=>s+=`<circle cx="${x(i)}" cy="${y(t)}" r="4" fill="var(--ac)"/><text x="${x(i)}" y="${y(t)-9}" text-anchor="middle">${lab[i]}</text><text x="${x(i)}" y="${h-8}" text-anchor="middle">${2022+i}</text>`);return s+"</svg>"}

const gsum=g=>{const r=[0,0,0];A().forEach((a,i)=>{if(G[i]==g)for(let k=0;k<3;k++)r[k]+=a[k]});return r};

 else{const g=[...GG].sort((x,y)=>cvol(t,ts,grpIds(y))-cvol(t,ts,grpIds(x))),tp=[...IDS].sort((x,y)=>cvol(t,ts,[y])-cvol(t,ts,[x])).slice(0,3),

  wr=wg?ccom(t,ts,grpIds(wg))/cvol(t,ts,grpIds(wg))*100:0;
  b=`<p>Wisatawan dari <b>${nm}</b> paling banyak datang untuk <b>${IG[g[0]].ic} ${IG[g[0]].n}</b> (${IG[g[0]].d}), lalu ${IG[g[1]].ic} ${IG[g[1]].n}.</p><p class="note">Urutan minat: ${g.map(k=>IG[k].ic+" "+IG[k].n).join(" › ")}</p><p style="margin-bottom:2px"><b>Topik yang paling dicari:</b></p>${li(tp.map(i=>`<b>${IN(i)}</b> — ${SD[i]}.`))}<p>${wg&&stt(wr)[1]!="G"?`Hal yang paling sering membuat mereka kurang puas: <b>${IG[wg].n}</b>.`:"Secara umum wisatawan dari negara ini cukup puas."}</p>`}
 return `<div class="card"><h2>🔎 Pilih negara asal wisatawan</h2><select class="noprint" onchange="pickC(this.value)" aria-label="Pilih negara">${all.map(x=>`<option value="${x.c}" ${x.c===cu.c?"selected":""}>${cap(x.c)}</option>`).join("")}</select>${b}</div>`};
const li=a=>`<ul class="lg">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const fix=ts=>{const o=[...GG].sort((a,b)=>grt(b,ts)-grt(a,ts));return o.map(g=>{const r=grt(g,ts),[l,c]=stt(r),d=grt(g,[3])-grt(g,[0]),tr=ts.length>1?(d<-.5?" · cenderung membaik":d>.5?" · cenderung memburuk":" · stabil"):"";
 return `<div class="gr"><span class="ic">${IG[g].ic}</span><div><b>${IG[g].n}</b> <span class="tag ${c}">${l}</span><span class="note">${tr}</span><p style="margin:4px 0">${c=="G"?"Pertahankan mutu layanan yang sudah baik.":ACT[g][0]+"."}</p><span class="note">Pihak terkait: ${ACT[g][1]}</span></div></div>`}).join("")};
const fin=(ts,lbl)=>{const o=gord(ts),f=[...GG].sort((a,b)=>grt(b,ts)-grt(a,ts)),w=f[0],b=f[3],ws=stt(grt(w,ts))[1];
 const ch=ts.length>1?shTxt(0,3,2):null;
 return `<div class="card fin"><h2>✨ Informasi akhir${lbl}</h2><ul class="lg">${(()=>{const c=cty(ts,3);return c.length?`<li><b>Wisatawan terbanyak dari:</b> ${c.map(x=>cap(x.c)).join(", ")}.</li>`:""})()}<li><b>Alasan utama datang:</b> ${IG[o[0]].d}, serta ${IG[o[1]].d}.</li>${ch?`<li><b>Perubahan dari waktu ke waktu:</b> ${ch.join("; ")}.</li>`:""}<li><b>Yang perlu diperbaiki:</b> ${ws=="G"?"semua kelompok wisata sudah memuaskan.":`${IG[w].n.toLowerCase()} — ${ACT[w][0].toLowerCase()}.`}</li><li><b>Yang sudah memuaskan:</b> ${IG[b].n.toLowerCase()}.</li></ul></div>`};
const INFO=()=>{const w=sc(),sel=(window.iy===undefined||window.iy==="all")?"all":+window.iy,hero=`<section class="hero">${HERO_SVG}<div><h2>Mengapa wisatawan datang ke Indonesia?</h2><p>Ringkasan sederhana dari ulasan wisatawan mancanegara 2022–2025: apa yang mereka cari, apa yang berubah tiap tahun, dan apa yang perlu dibenahi.</p></div></section>`;
 const tabs=`<div class="yt noprint"><button class="${sel=="all"?"on":""}" onclick="iy='all';go('beranda')">Versi lengkap</button>${YRS.map((y,k)=>`<button class="${sel===k?"on":""}" onclick="iy=${k};go('beranda')">Tahun ${y}</button>`).join("")}</div><p class="note">Cakupan: <b>${cap(w)}</b> (ubah di filter atas). Pilih <b>Versi lengkap</b> untuk gambaran seluruh tahun, atau pilih satu tahun untuk melihat tahun itu saja.</p>`;
 if(tvv(ALL)<300)return hero+tabs+`<div class="card alert">Data wilayah ini terlalu sedikit untuk dirangkum. Pilih wilayah lain di filter atas.</div>`;
 if(sel=="all"){
  return hero+tabs+`<div class="card"><h2>Alasan utama wisatawan datang, tahun ke tahun</h2><div class="grid">${YRS.map((y,k)=>{const o=gord([k]),s=tops([k],1)[0];return `<div class="card yc"><h3>${y}</h3>${tvv([k])<100?'<p class="note">Data terlalu sedikit.</p>':`<p>${IG[o[0]].ic} <b>${IG[o[0]].n}</b></p><p>${IG[o[1]].ic} ${IG[o[1]].n}</p><p class="note">Paling dicari: ${IN(s)}</p>`}</div>`}).join("")}</div></div>
<div class="card"><h2>Apa yang berubah dari tahun ke tahun?</h2>${li([1,2,3].map(k=>`<b>${YRS[k-1]} → ${YRS[k]}:</b> ${shTxt(k-1,k,1).join("; ")}.`).concat([`<b>Secara keseluruhan (2022 → 2025):</b> ${shTxt(0,3,2).join("; ")}.`]))}</div>
<div class="card"><h2>Alasan paling populer sepanjang 2022–2025</h2>${li(tops(ALL,5).map(i=>`<b>${IN(i)}</b> — wisatawan datang untuk ${SD[i]}.`))}</div>
${ctyL(ALL,8,"Dari negara mana wisatawan datang?")}${(()=>{const r=YRS.map((y,j)=>cty([j],3).map(x=>cap(x.c)));return r[0].length?`<div class="card"><h2>Negara asal teratas tiap tahun</h2>${li(r.map((x,j)=>`<b>${YRS[j]}:</b> ${x.join(", ")}`))}</div>`:""})()}${CP(ALL)}<div class="card"><h2>Yang perlu diperbaiki dan yang sudah baik</h2>${fix(ALL)}</div>${fin(ALL,"")}`}
 const t=sel,y=YRS[t];
 if(tvv([t])<100)return hero+tabs+`<div class="card alert">Data tahun ${y} di wilayah ini terlalu sedikit untuk dirangkum.</div>`;
 const o=gord([t]),tp=tops([t],3),pv=t?tops([t-1],3):[],nw=tp.filter(i=>!pv.includes(i));
 return hero+tabs+`<div class="card"><h2>Mengapa wisatawan datang di tahun ${y}?</h2><p>Sebagian besar datang untuk ${IG[o[0]].d}, lalu ${IG[o[1]].d}.</p><div class="grid">${tp.map((i,k)=>`<div class="card yc"><span class="note">Alasan ke-${k+1}</span><h3 style="font-size:17px">${IN(i)}</h3><p>Wisatawan datang untuk ${SD[i]}.</p></div>`).join("")}</div></div>
${ctyL([t],5,"Dari negara mana wisatawan datang di tahun "+y+"?")}
${CP([t])}<div class="card"><h2>Yang perlu diperbaiki di tahun ${y}</h2>${fix([t])}</div>${fin([t]," tahun "+y)}`};
